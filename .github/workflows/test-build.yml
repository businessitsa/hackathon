name: Test Build

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

defaults:
  run:
    working-directory: hackathon

jobs:
  test-build:
    name: Test Docusaurus build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hackathon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test build website
        run: npm run build
